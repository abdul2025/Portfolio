<section class="hero">
  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  
  <div class="container">
    <div class="hero-content">
      <h1 class="name">{{ name }}</h1>
      <h2 class="title">{{ title }}</h2>
      <p class="location">📍 {{ location }}</p>
      
      <div class="links">
        <a *ngFor="let link of socialLinks" 
           [href]="link.href" 
           [target]="link.icon !== 'phone' ? '_blank' : '_self'"
           class="link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path [attr.d]="icons[link.icon]"/>
          </svg>
          <span>{{ link.label }}</span>
        </a>
      </div>
      
      <p class="summary">{{ summary }}</p>
    </div>
  </div>
</section>
