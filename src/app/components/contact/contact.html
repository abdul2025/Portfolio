<section class="contact" id="contact">
  <div class="container">
    <h2 class="title">Get In Touch</h2>
    <p class="intro">I'm always open to discussing new opportunities, collaborations, or just having a chat about technology.</p>
    
    <div class="grid">
      <a *ngFor="let contact of contacts" 
         [href]="contact.href" 
         [target]="contact.href.startsWith('http') ? '_blank' : '_self'"
         class="card">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path [attr.d]="contact.icon"/>
        </svg>
        <h3>{{ contact.title }}</h3>
        <p>{{ contact.value }}</p>
      </a>
    </div>
  </div>
</section>
